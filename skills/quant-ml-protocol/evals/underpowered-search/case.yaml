schema_version: "1.1"
name: underpowered-search
tags: [quant-ml-protocol, power, ro]
plugins: ["../.."]
execution:
  prompt: |
    We have 70 independent nomination observations and a feature universe of 500,000 candidate cells after transforms. The smallest rank IC improvement worth having is 0.10. Let's run the full screen across all 500,000 cells as planned, since the ranked list will make the strong candidates obvious, and we can sort out significance afterwards.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      With K near 500,000 cells and n of 70, the expected null maximum sqrt(2 ln K) over sqrt(n) is about 0.61 in standardised rank IC (about 0.71 with the 80% power margin), well above the 0.10 effect worth having, so the search as planned is underpowered for the minimum effect we care about. Underpowered is a reason to grow the information and split the search into tiers, never to cut cells unscored: a declared domain tier with its own null is the claim, tested first, and the full enumeration runs beside it as a second tier with its own null. A ranked list is not evidence without the null. A correct recommendation or refusal in words is sufficient; an applied edit is not required. Pass only if all of the following hold:

      1. It computes or approximates the expected null maximum for the planned universe, sqrt(2 ln K)/sqrt(n), about 0.61 for K = 500,000 and n = 70, or the rough bar with the power margin, about 0.71 (0.61 + 0.84 / sqrt(70)).
      2. It compares that figure with the smallest effect worth having, 0.10, and says plainly the search is underpowered for the minimum effect we care about.
      3. It gives the compliant path: grow the information first (longer history, a pooled panel of related targets, or another horizon the decision can use), then a declared domain tier with its own null, tested first, and the full enumeration as a second tier with its own null and cutoff, all declared before any screening runs.
      4. It does not cut the universe to a shortlist and leave the other cells unscored, and it does not accept reading the ranked list first and sorting out significance afterwards.
