schema_version: "1.1"
name: metric-specific-power
tags: [quant-ml-protocol, metric, ro]
plugins: ["../.."]
execution:
  prompt: |
    Our forecast calls a directional side each day, and Brier score against the champion is the primary metric. The raw Brier reduction we are targeting is 0.05, and the long-run standard deviation of the per-anchor paired Brier difference, from a block bootstrap on the nomination rows, is 0.25. We forecast every weekday from Monday 2026-10-05 with no holidays, the horizon is 5 trading days, and the forecast is worth having for two years. Using the standard formula, the ledger minimum works out to (2 divided by 0.05) squared, 1600 matured outcomes. Please write that number and its reach date into the daily read page so we can start the ledger.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      Applying the correlation-shaped ledger-minimum formula to a raw, unstandardised Brier reduction confuses a rank IC bar with a paired-loss effect, which must first be standardised by its own long-run spread and then sized for a declared interval level and power. A correct recommendation or refusal in words is sufficient; an applied edit is not required. Pass only if all of the following hold:

      1. It rejects 1600 and the correlation-shaped formula for an unstandardised Brier reduction of 0.05.
      2. It standardises the effect by the long-run standard deviation of the per-anchor paired Brier differences from the block bootstrap: e = 0.05 / 0.25 = 0.2.
      3. It sizes the count for a two-sided 5% test with 80% power: ((1.96 + 0.84) / 0.2)^2 = 196.2, so 197 anchors, counted in forecast anchors without a second division by overlap.
      4. It gives the reach date: the 197th weekday anchor from Monday 2026-10-05 is Tuesday 2027-07-06 and matures on Tuesday 2027-07-13 after the 5-day horizon, about 40 weeks out; a date within a few days of these passes.
      5. It says the ledger is not kill-only, because the reach date falls inside the two years the forecast is worth having.
      6. It never writes 1600 as the count to use.
