schema_version: "1.1"
name: gain-beyond-headroom
tags: [quant-ml-protocol, leak, notice]
plugins: ["../.."]
execution:
  prompt: |
    Airport taxi-out campaign, stage 3. Before this round we measured headroom for a gate-occupancy feature by plugging in the true occupancy: at best it improves RMSE by 1.2 s, because the slice it targets (arrivals in the evening bank) carries 6% of the squared error. The variant with the feature just came back from evaluate.py: RMSE improvement 4.8 s, interval [4.3, 5.3], better in every window. That's our biggest gain of the campaign. Log it as the new champion and brief the next round?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      A gain four times the idea's own measured headroom, on a slice holding 6% of the error, cannot come from the idea working; it is a suspected leak. Pass only if all of the following hold:

      1. It says the 4.8 s gain exceeds the 1.2 s headroom and treats this as a suspected leak (or a bug), not a win.
      2. It does not make the variant the new champion and does not brief the next round until the gain is explained.
      3. It names at least two concrete checks: the feature's availability timestamp against the forecast cutoff, the purge or gap, fold-local fitting, or a row-level comparison of where the gain lands against the evening-bank slice.
