schema_version: "1.1"
name: live-window-spec-id
tags: [quant-ml-protocol, ledger, ro]
plugins: ["../.."]
execution:
  prompt: |
    The frozen spec from stage 8 is a ridge on a 52-week rolling window, refit monthly. For the live daily read we refit it each month on all history to date, since more data can only help. Our spec tag hashes the cell id, the code commit, the environment and the dataset manifest, and because the manifest changes with every weekly pull, each week opens a new ledger track. Six weeks of rows have accrued so far. Is the live setup right, and how should we count those rows toward the read rule's minimum?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      The live model must be the frozen cell rolled forward, trained on its 52-week window at the declared refit dates, and the identity scheme must let evidence accumulate under one spec across routine refits and data pulls. A correct recommendation or refusal in words is sufficient; an applied edit is not required. Pass only if all of the following hold:

      1. It says the live refits must train on the eligible rows within the 52-week window at each declared monthly refit date, reusing the last fitted model between refits, not on all history.
      2. It separates three identities, in these or equivalent names: a spec_id for the frozen modelling and decision rules (cell, code, environment, with the manifest left out), a fit_id for each scheduled refit and its training-data snapshot, and a forecast_id for each prediction and its input snapshot.
      3. It says only a spec change opens a new ledger track: routine monthly refits make new fit ids and weekly data pulls make new forecast input snapshots, all under one spec_id track.
      4. It says the six weeks of all-history rows are labelled off-spec and kept on the append-only ledger, not deleted, and are left out of the count toward the read rule's minimum.
