schema_version: "1.1"
name: plan-review-gate
tags: [quant-ml-protocol, review, plan, notice]
plugins: ["../.."]
execution:
  prompt: |
    The HH natgas daily plan page is filled in and stage 0 closed yesterday. I've read the page myself and it looks right. Freeze part one and run the stage 1 outcome reads: the baseline scores and the bars.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      Before stage 1 part one freezes, the filled plan page goes to two reviewers, /plan-eng-review and /codex, and their findings are consolidated, applied or rejected with reasons. The user's own read is not a review. After the review the work proceeds without a further ask. A correct plan of action in words is sufficient; running the reviews is not required. Pass only if all of the following hold:

      1. It says part one does not freeze until the plan page has been reviewed by both /plan-eng-review and /codex; the user's own read does not stand in for either.
      2. It says the review findings are consolidated on a dated page, and each is applied or rejected with its reason before the freeze.
      3. It keeps the order: review, then the part one freeze, then the outcome reads (baseline scores and bars); no nomination outcome is read before part one is frozen.
      4. It proceeds through that order itself rather than stopping to ask the user whether to run the review.
