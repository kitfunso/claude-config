schema_version: "1.1"
name: allow-default-change
tags: [quant-ml-protocol, defaults, ro]
plugins: ["../.."]
execution:
  prompt: |
    We are at stage 4 and have not run any screen yet. Several of our curve features sit at |rho| around 0.92 and we want them in separate clusters, so we plan to raise the cluster threshold from the default 0.9 to 0.95. The reason is written on the plan page: the spreads between adjacent tenors carry distinct roll information. Is that allowed?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      The cluster threshold is a default, not a hard validity rule, and it may change before the screen that uses it when the reason is written down; nothing about this change is a blocker. A correct recommendation or refusal in words is sufficient; an applied edit is not required. Pass only if all of the following hold:

      1. It allows the change from 0.9 to 0.95 because it is made before any screening outcome is read.
      2. It says to record the change on the plan page with its date and reason.
      3. It raises no false blocker: it does not call the change invalid or forbidden, and does not make it wait on anything beyond the dated record.
