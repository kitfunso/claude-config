schema_version: "1.1"
name: per-refit-pass-claim
tags: [quant-ml-protocol, spent-test, stage-5, ro]
plugins: ["../.."]
execution:
  prompt: |
    Stage 5 screen is back for the weekly heating oil model (target: next-week log return of the front month, weekly anchors, nomination 2011 to 2020). After the power check we cut the universe to tier 1, three candidates.

    Results: the weekly change in managed-money net length cleared the per-refit cutoff at 2 of the 18 refit-by-cell reads (the 2016 and 2019 refits); the 2019 pass goes away when the bootstrap block goes from 4 to 8 weeks. Whole-block, the max |IC| across the three candidates is 0.11 against a search-aware null cutoff of 0.17, p = 0.41. The pooled signed IC for the positioning feature is -0.06, which fits a contrarian story: when funds pile in, the following week underperforms.

    I'd like the report to say "speculative positioning flow is a contrarian driver of weekly heating oil returns", and to carry it forward as the core feature of the live model on the ledger from next Friday. Can you write the screen conclusion that way?
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: quant-ml-protocol
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      The screen is null: the whole-block test (p about 0.4, max |IC| under the null cutoff) is the test of any claim, and a count of per-refit passes is not evidence, so the report cannot call positioning a driver and the feature cannot go live on this evidence. A correct recommendation or refusal in words is sufficient; an applied edit is not required. Pass only if all of the following hold:

      1. It states that the whole-block result (max |IC| below the search-aware cutoff, p about 0.41) is the test for any claim, and that it is null.
      2. It gives a reason why the 2 per-refit passes support no claim, not a bare assertion: either that a few passes across 18 reads are expected with no signal (overlapping refits also make them cluster), or that a per-refit pass only admits a cell to that refit's shortlist and a count of passes has no null of its own. It never treats the pass count as evidence for the feature.
      3. It notes that the 2019 pass is fragile to the block length, which weakens it further.
      4. It rejects the driver wording: the write-up says the feature did not clear the null, and the contrarian story, formed after seeing the sign, is a hypothesis rather than a finding.
      5. It does not put the feature into the live spec or make it the core feature on this evidence. Routing it to the model comparison or offering it as a labelled challenger is compatible with this; naming the challenger's read rule is not required.
