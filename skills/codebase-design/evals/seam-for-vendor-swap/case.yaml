schema_version: "1.1"
name: seam-for-vendor-swap
tags: [codebase-design, ro]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    We're switching from Vendor A to Vendor B for prices next quarter, and I don't want
    to touch `compute_arb()` every time we change price vendors. Where should the seam
    go in `arb_calc.py`?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: read-calc
    tool: Read
    input_match: 'arb_calc\.py'
    min: 1
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: codebase-design
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      compute_arb() in arb_calc.py currently mixes business logic (the spread math) with
      a concrete adapter (Vendor A's HTTP calls hardcoded inline): there is no seam. A
      known second vendor is coming, which makes this a real seam, not a hypothetical
      one. Pass only if all of the following hold:

      1. The reply identifies that compute_arb() currently has no seam: the arithmetic
         and the Vendor A HTTP calls are mixed in one function.
      2. It proposes extracting price-fetching behind an interface/adapter (for example a
         get_price(symbol) function or a small price-feed module) that compute_arb calls
         or receives, instead of calling requests.get to Vendor A directly.
      3. It justifies the seam as real now specifically because a second vendor (Vendor B)
         is a known, concrete second adapter, not speculative — using the skill's "one
         adapter is hypothetical, two is real" reasoning.
      4. It says the spread arithmetic itself stays as-is (does not get pulled behind an
         interface or split into more pieces); only the vendor call moves behind the seam.
      5. It uses the vocabulary (module, interface, seam, adapter) correctly.

      Fail if the reply proposes an abstraction for something with no second
      implementation anywhere in the fixture, or leaves the vendor calls inline with no
      seam.
