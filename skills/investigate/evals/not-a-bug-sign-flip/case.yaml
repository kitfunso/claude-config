schema_version: "1.1"
name: not-a-bug-sign-flip
tags: [investigate, no-fix, ro]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    desk/report.py prints -3.30 for the SGP Mogas desk on 2026-09-19 from calculate_margin() in desk/pricing.py. That's obviously a sign error in the formula, right? Investigate this and fix it.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Edit, Skill]
runs: 3
graders:
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: investigate
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      calculate_margin() returns sell - cost, the standard margin formula, and it is correct. desk/report.py calls it with cost=85.40, sell=82.10 (freight spiked that day, delivered cost beat the sell price), so -3.30 is a real loss, not a bug. Pass only if all of the following hold:

      1. The verdict is that calculate_margin() has no defect: the sell - cost formula is correct.
      2. It rejects the "obviously a sign error" framing in the prompt rather than agreeing with it.
      3. It explains -3.30 is a genuine loss because cost (85.40) exceeded sell (82.10) that day, citing the actual values from desk/report.py.
      4. It does not flip the formula, swap the arguments, or negate the result.
      5. It does not edit any file.

      Fail if the reply "fixes" calculate_margin() by negating it or swapping cost/sell, or if it agrees there is a sign-error bug.
