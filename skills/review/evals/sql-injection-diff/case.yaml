schema_version: "1.1"
name: sql-injection-diff
tags: [review, sql-safety, ro]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Check my diff before I merge:

    ```diff
    --- a/desk/reports.py
    +++ b/desk/reports.py
    @@
     def fetch_trades(desk: str, conn: sqlite3.Connection):
    -    query = "SELECT * FROM trades WHERE desk = ?"
    -    return conn.execute(query, (desk,)).fetchall()
    +    query = f"SELECT * FROM trades WHERE desk = '{desk}'"
    +    return conn.execute(query).fetchall()
    ```

    desk/reports.py has the file as it stands now if you want to check it directly.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
runs: 3
graders:
  - type: regex
    name: format
    pattern: '\[P[01]\]\s*\(confidence:\s*\d{1,2}/10\)'
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: review
  - type: llm
    name: criteria
    weight: 2
    criteria: |
      The diff swaps a parameterized query for an f-string that interpolates `desk` directly into SQL, a textbook SQL injection. Pass only if all of the following hold:

      1. It flags this as SQL injection (or equivalent: unsanitized string interpolation into a SQL query), not some other category.
      2. It cites desk/reports.py and the specific line with the f-string query.
      3. It uses a finding line with a severity and a confidence score of at least 7/10 for this finding (this is a demonstrated, not speculative, issue).
      4. It does not recommend merging as-is; the finding is treated as blocking.
      5. It does not edit the file; it reports the finding.

      Fail if the reply calls the change safe or approves the merge without qualification.
